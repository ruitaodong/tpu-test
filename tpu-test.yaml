# Interactive TPU v5e debug pod for GKE Autopilot
#
#   kubectl apply -f tpu-test.yaml
#   kubectl wait --for=condition=Ready pod/tpu-test --timeout=15m
#   kubectl exec -it tpu-test -- bash
#   kubectl delete pod tpu-test
#
# Pin a version tag instead of :latest once you have one, e.g. :v1.10
apiVersion: v1
kind: Pod
metadata:
  name: tpu-test
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 14400   # auto-kill after 4h so a forgotten pod doesn't keep billing
  terminationGracePeriodSeconds: 0
  nodeSelector:
    cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
    cloud.google.com/gke-tpu-topology: 1x1
    topology.kubernetes.io/zone: us-east4-b
    # cloud.google.com/gke-spot: "true"   # uncomment for cheaper (preemptible) Spot capacity
  containers:
  - name: debug
    image: ghcr.io/ruitaodong/cnn-serve:latest
    command: ["sleep", "infinity"]
    resources:
      requests:
        google.com/tpu: 1
      limits:
        google.com/tpu: 1
