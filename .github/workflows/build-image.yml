# Build the TorchTPU image and push it to GitHub Container Registry (ghcr.io)
# whenever a version tag is pushed.
#
#   git tag v1.2.0 && git push origin v1.2.0
#   -> ghcr.io/<owner>/tpu-test:v1.2.0, :1.2.0, :1.2, :latest, :sha-abc1234
#   (non-semver tags like v1.10 still get :v1.10, :latest and :sha-...)
#
# No secrets or Google Cloud setup needed: the built-in GITHUB_TOKEN can push to GHCR.
# After the FIRST push, make the package public once:
#   GitHub profile/org > Packages > tpu-test > Package settings > Change visibility > Public

name: Build image on tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write   # lets GITHUB_TOKEN push to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tpu-test

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # GHCR image names must be lowercase; GitHub owner names may not be
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64   # TPU VMs and GKE TPU nodes are x86-64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}   # includes org.opencontainers.image.source, which links the package to this repo
          cache-from: type=gha
          cache-to: type=gha,mode=max
